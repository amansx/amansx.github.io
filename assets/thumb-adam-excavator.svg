<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Tracking an Excavator Without Cameras</title>
  <desc id="description">A systems diagram showing GPS, UWB, IMU, and LoRa telemetry converging on a live industrial digital twin.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f5f1e8" stroke-opacity=".08" stroke-width="1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="720" fill="#15191f"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <text x="64" y="74" fill="#f05245" font-family="monospace" font-size="18" font-weight="700" letter-spacing="3">ANIXIR / FIELD NOTE 08 / 2018</text>
  <g font-family="monospace" text-anchor="middle">
    <g fill="#15191f" stroke="#f5f1e8"><rect x="78" y="170" width="184" height="106"/><rect x="78" y="326" width="184" height="106"/><rect x="78" y="482" width="184" height="106"/></g>
    <g fill="#f5f1e8" font-size="18" font-weight="700"><text x="170" y="214">GPS</text><text x="170" y="370">UWB</text><text x="170" y="526">9-AXIS IMU</text></g>
    <g fill="#aeb7c6" font-size="12" letter-spacing="1"><text x="170" y="240">POSITION</text><text x="170" y="396">RANGE</text><text x="170" y="552">POSE + MOTION</text></g>
    <g stroke="#f05245" stroke-width="2" fill="none"><path d="M262 223 H438"/><path d="M262 379 H438"/><path d="M262 535 H438"/><path d="M438 223 V535"/><path d="M438 379 H543"/></g>
    <circle cx="438" cy="379" r="7" fill="#f05245" filter="url(#glow)"/>
    <rect x="543" y="304" width="190" height="150" fill="#f05245" stroke="#f5f1e8"/>
    <text x="638" y="365" fill="#15191f" font-size="26" font-weight="700">LoRa</text><text x="638" y="395" fill="#15191f" font-size="12" letter-spacing="1">SITE TELEMETRY</text>
    <path d="M733 379 H858" stroke="#f05245" stroke-width="2"/><path d="M850 371 L858 379 850 387" fill="none" stroke="#f05245" stroke-width="2"/>
    <circle cx="1010" cy="379" r="120" fill="#090d14" stroke="#f5f1e8" stroke-width="2"/>
    <circle cx="1010" cy="379" r="136" fill="none" stroke="#f05245" stroke-width="1" stroke-dasharray="8 8"/>
    <text x="1010" y="358" fill="#f5f1e8" font-size="25" font-weight="700">LIVE TWIN</text><text x="1010" y="389" fill="#aeb7c6" font-size="12" letter-spacing="1">SPACE + STATE</text><text x="1010" y="412" fill="#f05245" font-size="12" letter-spacing="1">RISK + USE</text>
  </g>
  <text x="64" y="654" fill="#f5f1e8" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="-3">TRACKING AN EXCAVATOR WITHOUT CAMERAS</text>
</svg>
