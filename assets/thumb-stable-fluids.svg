    <circle cx="130" cy="344" r="2"/><circle cx="1152" cy="330" r="3"/><circle cx="1034" cy="254" r="2"/><circle cx="238" cy="278" r="2"/><circle cx="905" cy="382" r="2"/>
  </g>
  <path d="M644 566C518 486 526 400 650 360C778 318 784 226 672 142C838 222 886 338 788 414C708 476 748 526 690 574Z" fill="url(#smoke)" opacity=".72" filter="url(#blur)"/>
  <path d="M644 566C546 493 563 421 661 380C754 341 780 268 703 184C813 259 823 351 748 410C679 464 726 519 682 570Z" fill="url(#smoke)" opacity=".9"/>
  <circle cx="650" cy="566" r="118" fill="url(#core)"/>
  <circle cx="650" cy="566" r="42" fill="url(#core)"/>
  <text x="64" y="78" fill="#f05245" font-family="monospace" font-size="17" font-weight="700" letter-spacing="3">ANIXIR / FIELD NOTE 09 / AUGUST 2010</text>
  <text x="64" y="532" fill="#f5f1e8" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" letter-spacing="-2">STABLE SYSTEMS FROM</text>
  <text x="64" y="582" fill="#f5f1e8" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" letter-spacing="-2">UNSOLVED MATHEMATICAL</text>
  <text x="64" y="632" fill="#f5f1e8" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" letter-spacing="-2">PROBLEMS</text>
  <text x="68" y="680" fill="#aeb7c6" font-family="monospace" font-size="16" letter-spacing="2">ADD / DIFFUSE / ADVECT / PROJECT</text>
