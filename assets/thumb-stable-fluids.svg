<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Stable Systems from Unsolved Mathematical Problems</title>
  <desc id="description">A bright fluid plume rises from a colorful nebula core through a field of stars.</desc>
  <defs>
    <radialGradient id="core">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".18" stop-color="#ffe057"/>
      <stop offset=".52" stop-color="#ff57cf"/>
      <stop offset="1" stop-color="#7765ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2=".45" y2="0">
      <stop offset="0" stop-color="#ffe057"/>
      <stop offset=".44" stop-color="#ff57cf"/>
      <stop offset="1" stop-color="#77c5ff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d2e6ff" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="#050811"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <g fill="#d2e6ff">
